[project]
name = "cert-radar"
version = "0.1.0"
description = "Sistema pessoal de curadoria, matching e radar contínuo de certificações e vouchers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
cert-radar = "cert_radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cert_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
